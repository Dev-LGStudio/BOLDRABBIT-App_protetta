*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:#EFEDEA;color:#151515;display:grid;place-items:center;padding:24px;

form{width:100%;max-width:320px;text-align:center}
img{width:84px;height:84px;border-radius:22px;box-shadow:0 10px 30px rgba(28,24,20,.15)}

button{width:100%;min-height:52px;margin-top:10px;border:0;border-radius:999px;background:#151515;color:#fff;font:inherit;font-size:15px;font-weight:600}
button:disabled{opacity:.5}
p{min-height:20px;margin-top:12px;font-size:13px;color:#8E4B3E}
.u{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
</style>
